services:
  postgres:
    image: postgres:16-alpine
    container_name: pegaxus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pegaxus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pegaxus_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pegaxus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pegaxus_user} -d ${POSTGRES_DB:-pegaxus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pegaxus-network

  redis:
    image: redis:7-alpine
    container_name: pegaxus_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pegaxus-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pegaxus_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pegaxus_db};Username=${POSTGRES_USER:-pegaxus_user};Password=${POSTGRES_PASSWORD:-pegaxus_secret_password}
      ConnectionStrings__Redis: redis:6379
      JwtOptions__SecretKey: ${JWT_SECRET:-YourSuperSecretKeyWithAtLeast32CharactersLongForPegaxus2026!}
      JwtOptions__Issuer: ${JWT_ISSUER:-Pegaxus.API}
      JwtOptions__Audience: ${JWT_AUDIENCE:-Pegaxus.Client}
      JwtOptions__ExpirationMinutes: ${JWT_EXPIRY_MINUTES:-15}
      MailOptions__Mail: ${MailOptions__Mail:-}
      MailOptions__DisplayName: ${MailOptions__DisplayName:-Pegaxus}
      MailOptions__Password: ${MailOptions__Password:-}
      MailOptions__Host: ${MailOptions__Host:-smtp.gmail.com}
      MailOptions__Port: ${MailOptions__Port:-587}
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - pegaxus-network

volumes:
  postgres_data:
    driver: local

networks:
  pegaxus-network:
    driver: bridge
