services:
  postgres:
    image: postgres:16-alpine
    container_name: pegaxus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pegaxus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pegaxus_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pegaxus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pegaxus_user} -d ${POSTGRES_DB:-pegaxus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pegaxus-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pegaxus_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-pegaxus_db};Username=${POSTGRES_USER:-pegaxus_user};Password=${POSTGRES_PASSWORD:-pegaxus_secret_password}
      JwtSettings__Secret: ${JWT_SECRET:-YourSuperSecretKeyWithAtLeast32CharactersLongForPegaxus2026!}
      JwtSettings__Issuer: ${JWT_ISSUER:-Pegaxus.API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-Pegaxus.Client}
      JwtSettings__ExpiryInMinutes: ${JWT_EXPIRY_MINUTES:-1440}
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - pegaxus-network

volumes:
  postgres_data:
    driver: local

networks:
  pegaxus-network:
    driver: bridge
